{% extends 'base.html' %}

{% block title %}
Все записи
{% endblock %}

{% block content %}
<h1>Все записи</h1>
<div class="row">
    {% for post in posts %}
    <div class="col-md-6 item">
        <div class="item-in">
            <h4>{{post.title}}</h4>
            <div class="seperator"></div>
            <p>{{post.text}}</p>
            <a href="{{ url_for('post_detail', post_id=post.id)}}">
                Читать далее
                <i class="fa fa-long-arrow-right"></i>
            </a>
        </div>
        <small class="text-muted">
            Автор: {{ post.author.username }} | {{ post.created_at.strftime('%d.%m.%Y') }}
        </small>
    </div>
    {% endfor %}
</div>
{% endblock %}
