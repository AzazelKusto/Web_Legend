{% extends "base.html" %}

{% block title %}Главная — Habit Tracker{% endblock %}

{% block content %}
<h1 class="mb-4">Здравствуйте, это ваш - {{ app_name }}</h1>
    {% if habits %}
<div class="list-group">
    {% for habit in habits %}
    <div class="list-group-item">{{ habit }}</div>
    {% endfor %}
</div>
    {% else %}
<p class="text-muted">Пока нет привычек.</p>
    {% endif %}
{% endblock %}
